function toggleLanguage() {

  document.getElementById('homeBtn').textContent = t('home');
  renderCategories();

  if (!document.getElementById('quiz').classList.contains('hidden')) {
    renderQuestion();
  }
}

function renderCategories() {
  const grid = document.getElementById('categories');
  grid.innerHTML = '';

  translations[lang].categories.forEach((category, index) => {
    const card = document.createElement('div');
    card.className = 'category';
    card.dataset.search = (category.join(' ') + ' ' + translations[lang === 'en' ? 'ru' : 'en'].categories[index].join(' ')).toLowerCase();

    const title = document.createElement('h2');
    title.textContent = category[0];

    const description = document.createElement('p');
    description.textContent = category[1];

    const number = document.createElement('div');
    number.className = 'number';
    number.textContent = '10 QUESTIONS';

    card.append(title, description, number);
    card.addEventListener('click', () => startQuiz(index));
    grid.appendChild(card);
  });

  filterCategories();
}

function filterCategories() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  let visible = 0;

  document.querySelectorAll('.category').forEach(card => {
    const match = card.dataset.search.includes(query);
    card.classList.toggle('hidden', !match);
    if (match) visible++;
  });

  document.getElementById('noResults').classList.toggle('hidden', visible > 0);
}

document.getElementById('search').addEventListener('input', filterCategories);

function renderQuestion() {
  clearInterval(timer);
  answered = false;
  timeLeft = 20;

  const q = currentQuestions[currentQuestion];
  document.getElementById('counter').textContent =
    `${t('question')} ${currentQuestion + 1}/10`;
  document.getElementById('question').textContent = q.question;
  document.getElementById('feedback').textContent = '';
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('progress').style.width =
    `${currentQuestion / 10 * 100}%`;

  const shuffled = [...q.answers].sort(() => Math.random() - 0.5);
  const answersBox = document.getElementById('answers');
  answersBox.innerHTML = '';

  shuffled.forEach(answer => {
    const btn = document.createElement('button');
    btn.className = 'answer';
    btn.textContent = answer.text;
    btn.addEventListener('click', () => selectAnswer(btn, answer));
    answersBox.appendChild(btn);
  });

  updateTimer();
  timer = setInterval(() => {
    timeLeft--;
    updateTimer();
    if (timeLeft <= 0) {
      clearInterval(timer);
      revealAnswer(null);
    }
  }, 1000);
}

function updateTimer() {
  document.getElementById('timer').textContent =
    `${timeLeft} ${t('seconds')}`;
}

function selectAnswer(button, answer) {
  if (answered) return;

  if (answer.correct) score++;
  revealAnswer(answer);
}

function revealAnswer(selected) {
  if (answered) return;
  answered = true;
  clearInterval(timer);

  const buttons = document.querySelectorAll('.answer');
  let correctText = '';

  buttons.forEach(button => {
    const answer = currentQuestions[currentQuestion].answers
      .find(a => a.text === button.textContent);

    button.disabled = true;

    if (answer.correct) {
      button.classList.add('correct');
      correctText = answer.text;
    } else if (selected && answer.text === selected.text) {
      button.classList.add('wrong');
    }
  });

  let message;

  if (selected === null) {
    message = `${t('timeUp')} ${correctText}`;
  } else if (selected.correct) {
    message = t('correct');
  } else {
    message = `${t('wrong')} ${correctText}`;
  }

  document.getElementById('feedback').textContent = message;
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('nextBtn').textContent =
    currentQuestion === 9 ? t('completed') : t('next');
}

function nextQuestion() {
  if (!answered) return;

  currentQuestion++;

  if (currentQuestion >= 10) {
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz() {
  clearInterval(timer);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('resultTitle').textContent = t('completed');
  document.getElementById('resultDescription').textContent = t('yourResult');
  document.getElementById('score').textContent = `${score}/10`;

  let message = score >= 8 ? t('excellent') :
                score >= 5 ? t('good') : t('practice');

  document.getElementById('resultMessage').textContent = message;
}

function restartQuiz() {
  startQuiz(currentCategory);
}

function goHome() {
  clearInterval(timer);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  document.getElementById('search').value = '';
  filterCategories();
}

/* Snow animation */
const canvas = document.getElementById('snow');
const ctx = canvas.getContext('2d');
let flakes = [];

function resizeSnow() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  flakes = Array.from({length: Math.min(100, Math.floor(window.innerWidth / 8))},
    () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.5 + 0.7,
      speed: Math.random() * 1.1 + 0.4,
      drift: Math.random() * 0.6 - 0.3
    })
  );
}

function drawSnow() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = 'rgba(255,255,255,0.75)';

  flakes.forEach(f => {
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();

    f.y += f.speed;
    f.x += f.drift;

    if (f.y > canvas.height + 5) {
      f.y = -5;
      f.x = Math.random() * canvas.width;
    }

    if (f.x > canvas.width + 5) f.x = -5;
    if (f.x < -5) f.x = canvas.width + 5;
  });

  requestAnimationFrame(drawSnow);
}

resizeSnow();
window.addEventListener('resize', resizeSnow);

if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  drawSnow();
}
