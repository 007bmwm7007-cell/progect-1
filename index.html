
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RGames Quiz</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #050806;
    color: #f5f5f5;
    min-height: 100vh;
    overflow-x: hidden;
}

#snow {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 35px 20px;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 4px;
}

.logo span {
    color: #e53945;
}

.subtitle {
    color: #a8b5aa;
    margin-top: 10px;
    letter-spacing: 2px;
    font-size: 12px;
}

.panel {
    background: rgba(13, 25, 18, 0.94);
    border: 1px solid #294334;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
}

h1, h2 {
    text-align: center;
    margin-bottom: 18px;
}

.description {
    text-align: center;
    color: #b9c4bb;
    line-height: 1.6;
    margin-bottom: 25px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.category {
    background: #14251a;
    border: 1px solid #35523d;
    color: white;
    padding: 22px 15px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
    transition: .2s;
}

.category:hover {
    background: #203c29;
    border-color: #e53945;
    transform: translateY(-3px);
}

.category h3 {
    font-size: 17px;
    margin-bottom: 7px;
}

.category p {
    color: #aebbb0;
    font-size: 12px;
}

button {
    font-family: inherit;
}

.primary-btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #d93440;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
    transition: .2s;
}

.primary-btn:hover {
    background: #f04753;
}

.topbar {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.timer {
    background: #30171a;
    border: 1px solid #87333b;
    color: #ff6873;
    padding: 10px 15px;
    border-radius: 9px;
    font-weight: bold;
    font-size: 18px;
}

.progress {
    color: #aebbb0;
    font-size: 14px;
}

.progress-track {
    height: 7px;
    background: #26372b;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #d93440;
    transition: width .3s;
}

.question {
    font-size: 22px;
    line-height: 1.4;
    margin-bottom: 24px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    background: #17291d;
    color: white;
    border: 1px solid #36513c;
    border-radius: 10px;
    padding: 16px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;
    transition: .2s;
}

.answer:hover:not(:disabled) {
    background: #25432d;
    border-color: #6c9876;
}

.answer:disabled {
    cursor: default;
}

.answer.correct {
    background: #174b2b;
    border-color: #36b45b;
}

.answer.wrong {
    background: #501d23;
    border-color: #e34b58;
}

.feedback {
    min-height: 24px;
    margin-top: 18px;
    color: #c7d2c9;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

.result-score {
    font-size: 48px;
    font-weight: bold;
    color: #e84a55;
    text-align: center;
    margin: 20px 0;
}

.result-message {
    text-align: center;
    color: #c2cec5;
    line-height: 1.6;
}

.secondary-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    color: white;
    border: 1px solid #54705a;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 12px;
    font-size: 15px;
}

.secondary-btn:hover {
    background: #203c29;
}

@media (max-width: 600px) {
    .container {
        padding: 22px 14px;
    }

    .panel {
        padding: 20px 15px;
    }

    .categories {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 19px;
    }

    .logo {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="container">

<header>
    <div class="logo">R<span>G</span>AMES</div>
    <div class="subtitle">QUIZ CHALLENGE · WINTER EDITION</div>
</header>

<section id="menu" class="panel">
    <h1>Choose Your Quiz</h1>
    <p class="description">
        Select a category and test your knowledge.
        You have 5 minutes to answer 10 questions.
    </p>

    <div class="categories" id="categories"></div>
</section>

<section id="game" class="panel hidden">

    <div class="topbar">
        <div class="progress" id="progress">Question 1 / 10</div>
        <div class="timer" id="timer">05:00</div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <h2 id="categoryTitle"></h2>

    <div class="question" id="question"></div>

    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>

    <button class="primary-btn hidden" id="nextBtn">
        Next Question
    </button>

</section>

<section id="result" class="panel hidden">
    <h1>Quiz Completed</h1>

    <div class="result-score" id="score">0 / 10</div>

    <p class="result-message" id="resultMessage"></p>

    <button class="primary-btn" onclick="showMenu()">
        Choose Another Category
    </button>

    <button class="secondary-btn" onclick="restartQuiz()">
        Try Again
    </button>
</section>

</div>

const menu = document.getElementById("menu");
const game = document.getElementById("game");
const result = document.getElementById("result");

const categories = document.getElementById("categories");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const timerEl = document.getElementById("timer");
const progressEl = document.getElementById("progress");
const progressFill = document.getElementById("progressFill");
const feedbackEl = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

let currentCategory = "";
let questions = [];
let currentQuestion = 0;
let score = 0;
let timeLeft = 300;
let timerInterval = null;
let answered = false;

function createMenu() {
    categories.innerHTML = "";

    Object.keys(quizData).forEach(category => {
        const button = document.createElement("button");
        button.className = "category";

        button.innerHTML = `
            <h3>${category}</h3>
            <p>10 questions · 5 minutes</p>
        `;

        button.addEventListener("click", () => startQuiz(category));
        categories.appendChild(button);
    });
}

function startQuiz(category) {
    currentCategory = category;
    questions = quizData[category];
    currentQuestion = 0;
    score = 0;
    timeLeft = 300;

    menu.classList.add("hidden");
    result.classList.add("hidden");
    game.classList.remove("hidden");

    document.getElementById("categoryTitle").textContent = category;

    clearInterval(timerInterval);
    updateTimer();

    timerInterval = setInterval(() => {
        timeLeft--;
        updateTimer();

        if (timeLeft <= 0) {
            finishQuiz();
        }
    }, 1000);

    showQuestion();
}

function updateTimer() {
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;

    timerEl.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
}

function showQuestion() {
    answered = false;

    const q = questions[currentQuestion];

    progressEl.textContent =
        `Question ${currentQuestion + 1} / ${questions.length}`;

    progressFill.style.width =
        `${(currentQuestion / questions.length) * 100}%`;

    questionEl.textContent = q.q;
    answersEl.innerHTML = "";
    feedbackEl.textContent = "";
    nextBtn.classList.add("hidden");

    q.a.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = answer;

        button.addEventListener("click", () => selectAnswer(index));

        answersEl.appendChild(button);
    });
}

function selectAnswer(index) {
    if (answered) return;

    answered = true;

    const q = questions[currentQuestion];
    const buttons = answersEl.querySelectorAll(".answer");

    buttons.forEach((button, i) => {
        button.disabled = true;

        if (i === q.c) {
            button.classList.add("correct");
        }

        if (i === index && index !== q.c) {
            button.classList.add("wrong");
        }
    });

    if (index === q.c) {
        score++;
        feedbackEl.textContent = "Correct answer!";
    } else {
        feedbackEl.textContent =
            "Incorrect. The correct answer is: " + q.a[q.c];
    }

    progressFill.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    nextBtn.textContent =
        currentQuestion === questions.length - 1
            ? "Finish Quiz"
            : "Next Question";

    nextBtn.classList.remove("hidden");
}

nextBtn.addEventListener("click", () => {
    if (!answered) return;

    currentQuestion++;

    if (currentQuestion >= questions.length) {
        finishQuiz();
    } else {
        showQuestion();
    }
});

function finishQuiz() {
    clearInterval(timerInterval);

    game.classList.add("hidden");
    result.classList.remove("hidden");

    document.getElementById("score").textContent =
        `${score} / ${questions.length}`;

    let message = "";

    const percentage = (score / questions.length) * 100;

    if (percentage === 100) {
        message = "Perfect score! Outstanding knowledge!";
    } else if (percentage >= 80) {
        message = "Excellent work! You know this topic very well.";
    } else if (percentage >= 60) {
        message = "Good job! You have a solid knowledge base.";
    } else if (percentage >= 40) {
        message = "Not bad! There is still room to improve.";
    } else {
        message = "Keep learning and try again!";
    }

    if (timeLeft <= 0) {
        message += " Time is up!";
    }

    document.getElementById("resultMessage").textContent = message;
}

function showMenu() {
    clearInterval(timerInterval);

    game.classList.add("hidden");
    result.classList.add("hidden");
    menu.classList.remove("hidden");
}

function restartQuiz() {
    startQuiz(currentCategory);
}

createMenu();

// Snow animation
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let snowflakes = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    snowflakes = Array.from({ length: 100 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2.5 + 0.5,
        speed: Math.random() * 1.2 + 0.4,
        drift: Math.random() * 0.6 - 0.3
    }));
}

function drawSnow() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "rgba(255,255,255,0.8)";

    snowflakes.forEach(flake => {
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fill();

        flake.y += flake.speed;
        flake.x += flake.drift;

        if (flake.y > canvas.height) {
            flake.y = -5;
            flake.x = Math.random() * canvas.width;
        }

        if (flake.x > canvas.width) flake.x = 0;
        if (flake.x < 0) flake.x = canvas.width;
    });

    requestAnimationFrame(drawSnow);
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();
drawSnow();
</script>
