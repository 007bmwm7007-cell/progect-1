// Select a relevant ten-question pool for every category. Each pool contains ten bilingual questions.
const poolFor=i=>['newyear','starwars','homealone','cars','art','history','harrypotter','musicbands','capitals','space'][i];
const questionCount=()=>cat>=6?15:10;
let lang='en',cat=0,qi=0,score=0,timer=null,left=20,answered=false,shown=[],currentQ=null,answerOrder=[],selectedAnswerIndex=null,timedOut=false;
const t=k=>T[lang][k];
function render(){const g=document.getElementById('categories');g.innerHTML='';C.forEach((c,i)=>{let d=document.createElement('div');d.className='category';d.dataset.search=c.join(' ').toLowerCase();let h=document.createElement('h2');h.textContent=c[lang==='en'?0:1];let p=document.createElement('p');p.textContent=c[lang==='en'?2:3];let n=document.createElement('div');n.className='number';n.textContent=i<6?`${lang==='en'?'10 QUESTIONS':'10 ВОПРОСОВ'}`:`${lang==='en'?'15 QUESTIONS':'15 ВОПРОСОВ'}`;d.append(h,p,n);d.onclick=()=>start(i);g.append(d)});filter()}
function filter(){let s=document.getElementById('search').value.trim().toLowerCase(),n=0;document.querySelectorAll('.category').forEach(x=>{let ok=x.dataset.search.includes(s);x.classList.toggle('hidden',!ok);if(ok)n++});document.getElementById('noResults').classList.toggle('hidden',n>0)}
document.getElementById('search').addEventListener('input',filter);
function updateText(){document.documentElement.lang=lang;document.getElementById('langBtn').textContent=lang==='en'?'RU':'EN';document.getElementById('heroTitle').innerHTML=t('hero');document.getElementById('heroText').textContent=t('intro');document.getElementById('search').placeholder=t('search');document.getElementById('noResults').textContent=t('none');document.getElementById('retryBtn').textContent=t('retry');document.getElementById('homeBtn').textContent=t('home');document.getElementById('seoTitle').textContent=lang==='en'?'Explore Free Online Quiz Categories':'Исследуй категории онлайн-викторин';document.getElementById('seoIntro').textContent=lang==='en'?'Play free quizzes about New Year, Star Wars, Home Alone, cars, art, world history, Harry Potter, music bands, world capitals and space.':'Играй в бесплатные викторины о Новом годе, «Звёздных войнах», «Один дома», автомобилях, художниках, всемирной истории, Гарри Поттере, музыкальных группах, столицах стран и космосе.';}
function toggleLanguage(){lang=lang==='en'?'ru':'en';updateText();render();if(!document.getElementById('quiz').classList.contains('hidden'))renderCurrentQuestion();if(!document.getElementById('result').classList.contains('hidden'))renderResult()}
function start(i){cat=i;qi=0;score=0;document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');loadQ()}
function loadQ(){clearInterval(timer);const pool=Q[poolFor(cat)];currentQ=pool[qi];answerOrder=[0,1,2,3].sort(()=>Math.random()-.5);answered=false;selectedAnswerIndex=null;timedOut=false;left=20;renderCurrentQuestion();timer=setInterval(()=>{if(answered)return;left--;tick();if(left<=0){clearInterval(timer);reveal(null)}},1000)}
function renderCurrentQuestion(){if(!currentQ)return;const questionIndex=lang==='en'?0:1,answersIndex=lang==='en'?2:3;shown={question:currentQ[questionIndex],answers:currentQ[answersIndex].map((text,index)=>({text,correct:index===currentQ[4],index}))};document.getElementById('categoryName').textContent=C[cat][lang==='en'?0:1];document.getElementById('counter').textContent=`${t('q')} ${qi+1}/${questionCount()}`;document.getElementById('question').textContent=shown.question;document.getElementById('progress').style.width=`${(qi/questionCount())*100}%`;const box=document.getElementById('answers');box.innerHTML='';answerOrder.forEach(index=>{const a=shown.answers[index],b=document.createElement('button');b.className='answer';b.textContent=a.text;b.disabled=answered;b.onclick=()=>choose(a);if(answered&&a.correct)b.classList.add('correct');else if(answered&&selectedAnswerIndex===index&&!a.correct)b.classList.add('wrong');box.append(b)});renderFeedback();document.getElementById('nextBtn').classList.toggle('hidden',!answered);if(answered)document.getElementById('nextBtn').textContent=qi===questionCount()-1?t('done'):t('next');tick()}
function renderFeedback(){const el=document.getElementById('feedback');if(!answered){el.textContent='';return}const correct=shown.answers.find(a=>a.correct)?.text||'';el.textContent=timedOut?`${t('time')} ${correct}`:selectedAnswerIndex===currentQ[4]?t('correct'):`${t('wrong')} ${correct}`}
function tick(){document.getElementById('timer').textContent=`${left} ${t('sec')}`}
function choose(a){if(answered)return;if(a.correct)score++;reveal(a)}
function reveal(sel){if(answered)return;answered=true;timedOut=sel===null;selectedAnswerIndex=sel?sel.index:null;clearInterval(timer);renderCurrentQuestion()}
function nextQuestion(){if(!answered)return;qi++;if(qi===questionCount())finish();else loadQ()}
function finish(){clearInterval(timer);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');renderResult()}
function renderResult(){document.getElementById('resultTitle').textContent=t('done');document.getElementById('resultDescription').textContent=t('result');document.getElementById('score').textContent=`${score}/${questionCount()}`;document.getElementById('resultMessage').textContent=score>=Math.ceil(questionCount()*.8)?t('excellent'):score>=Math.ceil(questionCount()*.5)?t('good'):t('practice')}
function restartQuiz(){start(cat)}function goHome(){clearInterval(timer);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden');document.getElementById('search').value='';filter()}
updateText();render();
const cv=document.getElementById('snow'),cx=cv.getContext('2d');let flakes=[];function resize(){cv.width=innerWidth;cv.height=innerHeight;flakes=Array.from({length:Math.min(100,Math.floor(innerWidth/8))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.5+.7,s:Math.random()*1.1+.4,d:Math.random()*.6-.3}))}function snow(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='rgba(255,255,255,.75)';flakes.forEach(f=>{cx.beginPath();cx.arc(f.x,f.y,f.r,0,Math.PI*2);cx.fill();f.y+=f.s;f.x+=f.d;if(f.y>cv.height+5){f.y=-5;f.x=Math.random()*cv.width}if(f.x>cv.width+5)f.x=-5;if(f.x< -5)f.x=cv.width});requestAnimationFrame(snow)}resize();addEventListener('resize',resize);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)snow();
</script></body></html>
